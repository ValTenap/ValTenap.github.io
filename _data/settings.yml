# Research topics shown on /research/. "image" is optional.
research:
- name: 'Polarization Steganography'
  description: 'I study how the spatially varying polarization of partially polarized vector beams can be used to hide information. By engineering a beam whose polarization states fill a prescribed region of the Poincaré sphere, positions in the transverse plane map onto polarization states, so a hidden pattern only appears after applying the right spatial mask and a spatially resolved Stokes measurement. This work combines q-plate beam shaping, Stokes polarimetry, and numerical simulation, and explores how to quantify the security of such schemes.'
  image: 'assets/img/research_steganography.png'
  link: {text: 'Read the paper', url: 'https://arxiv.org/abs/2603.11427'}

- name: 'Volume Holographic Gratings as Generalized Beamsplitters'
  description: 'In the Lundeen Lab I work on volume holographic gratings as generalized beamsplitters — compact elements that can split, combine, and interfere several optical modes at once. My part of the project, in collaboration with the Singular Optics Group at Wrocław University of Science and Technology, focuses on the experimental proof of principle: two-mode operation and a three-port device with phase control.'
  image: 'assets/img/research_gratings.png'

- name: 'Polarization Response of Spaceplates'
  description: 'Spaceplates are nonlocal optical elements that compress free-space propagation into a thin device. Together with my group I characterize how the polarization of light changes alongside the compression in different spaceplate designs, using motorized Stokes polarimetry across a range of incidence angles.'
  image: 'assets/img/research_spaceplates.png'

