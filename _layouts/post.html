---
layout: default
---
<article class="wrap post">
  <header class="page-head">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
  <p><a href="{{ site.baseurl }}/">Back to home</a></p>
</article>
