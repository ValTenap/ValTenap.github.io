<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
  {% include head.html %}
  <body class="{% if page.dark_header %}is-dark{% endif %}">
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
    {% if page.scripts %}{% for s in page.scripts %}<script src="{{ site.baseurl }}/assets/js/{{ s }}" defer></script>{% endfor %}{% endif %}
  </body>
</html>
