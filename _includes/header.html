<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="{{ site.baseurl }}/"><span class="dot" aria-hidden="true"></span>{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.baseurl }}{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
