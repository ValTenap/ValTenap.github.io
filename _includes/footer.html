<footer class="pt-5 my-5 text-muted border-top">
  <div class="row">
    <div class="col-md-6">
      <small>&copy; {{ site.time | date: "%Y" }} {{ site.author }}</small>
    </div>
    <div class="col-md-6 text-md-end social-media-icons">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="ms-3 fs-5" aria-label="{{ item.icon }}"><i class="fab fa-{{ item.icon }}"></i></a>
      {% endfor %}
    </div>
  </div>
</footer>
